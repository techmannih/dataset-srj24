<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="622" viewBox="0 0 1152 622" role="img" aria-labelledby="title description">
  <title id="title">Rectangle and oval obstacle sample</title>
  <desc id="description">The same synthetic routing sample shown as rectangular bounds on the left and with oval types rendered as ellipses on the right. This illustrates a consumer of the corrected declarations, not a change to the dataset viewer.</desc>
  <rect width="1152" height="622" rx="18" fill="#0c121c" />
  <g font-family="Arial, sans-serif">
    <text x="36" y="43" fill="#f1f5f9" font-size="26" font-weight="700">Rectangle and oval obstacles</text>
    <text x="36" y="74" fill="#a6b7c9" font-size="16">Synthetic SRJ example · 6 obstacles · 3 ovals · 2 layers · dimensions in mm</text>
  <g transform="translate(36, 106)">
    <rect width="528" height="404" rx="14" fill="#151e29" stroke="#344254" />
    <text x="24" y="34" fill="#f1f5f9" font-size="20" font-weight="700">Rectangular bounds</text>
    <text x="24" y="60" fill="#a6b7c9" font-size="14">All obstacles shown as bounding rectangles</text>
    <rect x="26" y="102" width="476" height="272" fill="#101722" stroke="#435165" stroke-dasharray="4 5" />
    <line x1="60" y1="238" x2="468" y2="238" stroke="#9aadc4" stroke-width="1.5" stroke-dasharray="5 5" />
    <g fill="#f4a261" fill-opacity="0.3" stroke="#f4a261" stroke-width="2"><title>start</title><rect x="47.25" y="225.25" width="25.5" height="25.5" /></g>
    <text x="60" y="270.75" text-anchor="middle" fill="#dbe5ed" font-size="13">start</text>
    <g fill="#f4a261" fill-opacity="0.3" stroke="#f4a261" stroke-width="2"><title>end</title><rect x="455.25" y="225.25" width="25.5" height="25.5" /></g>
    <text x="468" y="270.75" text-anchor="middle" fill="#dbe5ed" font-size="13">end</text>
    <g fill="#f4a261" fill-opacity="0.3" stroke="#f4a261" stroke-width="2"><title>rectangle</title><rect x="128" y="153" width="102" height="51" /></g>
    <text x="179" y="224" text-anchor="middle" fill="#dbe5ed" font-size="13">rect 6 × 3</text>
    <g fill="#f4a261" fill-opacity="0.3" stroke="#f4a261" stroke-width="2"><title>horizontal-oval</title><rect x="298" y="153" width="102" height="51" /></g>
    <text x="349" y="224" text-anchor="middle" fill="#dbe5ed" font-size="13">oval 6 × 3</text>
    <g fill="#f4a261" fill-opacity="0.3" stroke="#f4a261" stroke-width="2"><title>vertical-oval</title><rect x="153.5" y="246.5" width="51" height="85" /></g>
    <text x="179" y="351.5" text-anchor="middle" fill="#dbe5ed" font-size="13">oval 3 × 5</text>
    <g fill="#f4a261" fill-opacity="0.3" stroke="#f4a261" stroke-width="2"><title>circular-oval</title><rect x="315" y="255" width="68" height="68" /></g>
    <text x="349" y="343" text-anchor="middle" fill="#dbe5ed" font-size="13">oval 4 × 4</text>
  </g>
  <g transform="translate(588, 106)">
    <rect width="528" height="404" rx="14" fill="#151e29" stroke="#344254" />
    <text x="24" y="34" fill="#f1f5f9" font-size="20" font-weight="700">Shape-aware TypeScript consumer</text>
    <text x="24" y="60" fill="#a6b7c9" font-size="14">Branches on type: "rect" | "oval"</text>
    <rect x="26" y="102" width="476" height="272" fill="#101722" stroke="#435165" stroke-dasharray="4 5" />
    <line x1="60" y1="238" x2="468" y2="238" stroke="#9aadc4" stroke-width="1.5" stroke-dasharray="5 5" />
    <g fill="#f4a261" fill-opacity="0.3" stroke="#f4a261" stroke-width="2"><title>start</title><rect x="47.25" y="225.25" width="25.5" height="25.5" /></g>
    <text x="60" y="270.75" text-anchor="middle" fill="#dbe5ed" font-size="13">start</text>
    <g fill="#f4a261" fill-opacity="0.3" stroke="#f4a261" stroke-width="2"><title>end</title><rect x="455.25" y="225.25" width="25.5" height="25.5" /></g>
    <text x="468" y="270.75" text-anchor="middle" fill="#dbe5ed" font-size="13">end</text>
    <g fill="#f4a261" fill-opacity="0.3" stroke="#f4a261" stroke-width="2"><title>rectangle</title><rect x="128" y="153" width="102" height="51" /></g>
    <text x="179" y="224" text-anchor="middle" fill="#dbe5ed" font-size="13">rect 6 × 3</text>
    <g fill="#56dcc2" fill-opacity="0.3" stroke="#56dcc2" stroke-width="2"><title>horizontal-oval</title><ellipse cx="349" cy="178.5" rx="51" ry="25.5" /></g>
    <text x="349" y="224" text-anchor="middle" fill="#dbe5ed" font-size="13">oval 6 × 3</text>
    <g fill="#56dcc2" fill-opacity="0.3" stroke="#56dcc2" stroke-width="2"><title>vertical-oval</title><ellipse cx="179" cy="289" rx="25.5" ry="42.5" /></g>
    <text x="179" y="351.5" text-anchor="middle" fill="#dbe5ed" font-size="13">oval 3 × 5</text>
    <g fill="#56dcc2" fill-opacity="0.3" stroke="#56dcc2" stroke-width="2"><title>circular-oval</title><ellipse cx="349" cy="289" rx="34" ry="34" /></g>
    <text x="349" y="343" text-anchor="middle" fill="#dbe5ed" font-size="13">oval 4 × 4</text>
  </g>
    <rect x="40" y="533" width="13" height="13" fill="#f4a261" />
    <text x="63" y="545" fill="#dbe5ed" font-size="14">Rectangle / bounding box</text>
    <ellipse cx="310" cy="540" rx="9" ry="6" fill="#56dcc2" />
    <text x="329" y="545" fill="#dbe5ed" font-size="14">Oval</text>
    <line x1="405" y1="540" x2="439" y2="540" stroke="#9aadc4" stroke-dasharray="5 5" />
    <text x="449" y="545" fill="#dbe5ed" font-size="14">Unrouted connection</text>
    <text x="36" y="582" fill="#a6b7c9" font-size="14">The declaration fix enables typed consumers; existing board data and the dataset viewer are unchanged.</text>
  </g>
</svg>
